/* ---------------------------------------------------------------
   Neural-network geometry (computed once)
---------------------------------------------------------------- */
const LAYERS = [4, 6, 6, 3];
const LAYER_X = [70, 195, 325, 450];
const LAYER_NAMES = ["Input layer", "Hidden layer", "Hidden layer", "Output layer"];
const LAYER_ROLES = [
  "Input layer: where the data enters.",
  "Hidden layer: where patterns are combined.",
  "Hidden layer: where patterns are combined.",
  "Output layer: where the result comes out.",
];
const READOUT_DEFAULT = "Hover a node to trace its connections. Click any node to send a signal through the network.";

const POS = LAYERS.map((n, l) => Array.from({ length: n }, (_, i) => [LAYER_X[l], 40 + (i + 0.5) * (290 / n)]));

const EDGES = (() => {
  const out = [];
  let k = 0;
  for (let l = 0; l < 3; l++) {
    POS[l].forEach((a, i) => {
      POS[l + 1].forEach((b, j) => {
        out.push({
          key: `${l}-${i}_${l + 1}-${j}`,
          a: `${l}-${i}`,
          b: `${l + 1}-${j}`,
          toLayer: l + 1,
          d: `M${a[0]},${a[1]} L${b[0]},${b[1]}`,
          flow: k % 4 === 0,
          blue: k % 8 === 0,
          delay: ((k % 7) * 0.4).toFixed(1),
        });
        k++;
      });
    });
  }
  return out;
})();

const NODES = POS.flatMap((col, l) => col.map(([x, y], i) => ({ id: `${l}-${i}`, l, i, x, y })));

/* ---------------------------------------------------------------
   Hooks
---------------------------------------------------------------- */
function useReducedMotion() {
  const [reduce, setReduce] = useState(
    () => typeof window !== "undefined" && window.matchMedia("(prefers-reduced-motion: reduce)").matches
  );
  useEffect(() => {
    const mq = window.matchMedia("(prefers-reduced-motion: reduce)");
    const onChange = () => setReduce(mq.matches);
    mq.addEventListener?.("change", onChange);
    return () => mq.removeEventListener?.("change", onChange);
  }, []);
  return reduce;
}

function useInView(threshold = 0.12) {
  const ref = useRef(null);
  const [inView, setInView] = useState(false);
  useEffect(() => {
    const el = ref.current;
    if (!el) return;
    if (!("IntersectionObserver" in window)) {
      setInView(true);
      return;
    }
    const io = new IntersectionObserver(
      ([entry]) => {
        if (entry.isIntersecting) {
          setInView(true);
          io.disconnect();
        }
      },
      { threshold }
    );
    io.observe(el);
    return () => io.disconnect();
  }, [threshold]);
  return [ref, inView];
}

/* Arrow-key navigation for tab lists */
function useTabKeys(count, select) {
  const refs = useRef([]);
  const onKeyDown = (e, i) => {
    const n = e.key === "ArrowRight" ? i + 1 : e.key === "ArrowLeft" ? i - 1 : null;
    if (n === null) return;
    e.preventDefault();
    const next = (n + count) % count;
    select(next);
    refs.current[next]?.focus();
  };
  return [refs, onKeyDown];
}

/* ---------------------------------------------------------------
   Hero network
---------------------------------------------------------------- */
function Network({ highlightTag }) {
  const reduce = useReducedMotion();
  const [hover, setHover] = useState(null);
  const [level, setLevel] = useState(-1);
  const [readout, setReadout] = useState(READOUT_DEFAULT);
  const busy = useRef(false);
  const timers = useRef([]);
  const svgRef = useRef(null);

  const fire = useCallback(() => {
    if (busy.current) return;
    busy.current = true;
    setReadout("Signal moving forward through the layers.");
    for (let l = 0; l < 4; l++) {
      timers.current.push(setTimeout(() => setLevel(l), l * 380));
    }
    timers.current.push(
      setTimeout(() => {
        setLevel(-1);
        busy.current = false;
      }, 1900)
    );
  }, []);

  useEffect(() => {
    if (reduce) return;
    const start = setTimeout(fire, 1500);
    const loop = setInterval(() => {
      if (!document.hidden && !svgRef.current?.matches(":hover")) fire();
    }, 6000);
    return () => {
      clearTimeout(start);
      clearInterval(loop);
      timers.current.forEach(clearTimeout);
      timers.current = [];
    };
  }, [fire, reduce]);

  const enter = (node) => {
    setHover(node.id);
    if (!busy.current) setReadout(LAYER_ROLES[node.l]);
  };

  return (
    <div className="grid-box">
      <svg
        ref={svgRef}
        className="grid-svg"
        viewBox="0 0 520 360"
        role="group"
        aria-label="Interactive neural network with input, graph attention, Transformer and output layers"
      >
        {EDGES.map((e) => {
          const on = hover && (e.a === hover || e.b === hover);
          const act = level >= e.toLayer;
          return (
            <g key={e.key}>
              <path className={`ln${on ? " on" : ""}${act ? " act" : ""}`} d={e.d} />
              {e.flow && (
                <path
                  className={`fl${e.blue ? " b" : ""}`}
                  d={e.d}
                  style={{ animationDelay: `-${e.delay}s` }}
                />
              )}
            </g>
          );
        })}
        {NODES.map((n, j) => (
          <circle
            key={n.id}
            className={`nd l${n.l}${level >= n.l ? " act" : ""}`}
            cx={n.x}
            cy={n.y}
            r={11}
            tabIndex={0}
            role="button"
            aria-label={`${LAYER_NAMES[n.l]}, node ${n.i + 1}. Press to send a signal.`}
            style={highlightTag !== null && j % TAGS.length === highlightTag ? { fill: "var(--gold)" } : undefined}
            onMouseEnter={() => enter(n)}
            onFocus={() => enter(n)}
            onMouseLeave={() => setHover(null)}
            onBlur={() => setHover(null)}
            onClick={fire}
            onKeyDown={(e) => {
              if (e.key === "Enter" || e.key === " ") {
                e.preventDefault();
                fire();
              }
            }}
          />
        ))}
      </svg>
      <div className="legend">
        <span><b style={{ background: "var(--card)", border: "1.5px solid var(--blue)" }} />Input</span>
        <span><b style={{ background: "var(--card)", border: "1.5px solid var(--muted)" }} />Hidden</span>
        <span><b style={{ background: "var(--card)", border: "1.5px solid var(--green)" }} />Output</span>
      </div>
      <p className="readout" aria-live="polite">{readout}</p>
    </div>
  );
}

function Counter({ value, suffix, start, reduce }) {
  const decimals = value % 1 ? 1 : 0;
  const fmt = (v) =>
    v.toLocaleString("en-GB", { minimumFractionDigits: decimals, maximumFractionDigits: decimals }) + suffix;
  const [text, setText] = useState(() => fmt(value));

  useEffect(() => {
    if (!start || reduce) return;
    let raf;
    let t0 = null;
    const step = (t) => {
      if (t0 === null) t0 = t;
      const k = Math.min((t - t0) / 1400, 1);
      const eased = 1 - Math.pow(1 - k, 3);
      setText(fmt(value * eased));
      if (k < 1) raf = requestAnimationFrame(step);
    };
    raf = requestAnimationFrame(step);
    return () => cancelAnimationFrame(raf);
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, [start, reduce, value]);

  return <span className="n">{text}</span>;
}
